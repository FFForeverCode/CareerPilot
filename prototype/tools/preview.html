<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型预览跳转</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; padding: 24px; background: #F6F4F1; color: #1f2937; }
  code { background: #fff; border: 1px solid #e5e2dc; border-radius: 6px; padding: 1px 6px; }
  a { color: #1F4E79; }
</style>
</head>
<body>
<h1>原型预览跳转</h1>
<p>按角色登录后跳到指定页面。参数：<code>?role=student|teacher|admin&amp;route=%23/home</code></p>
<p id="msg">正在准备…</p>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/mock-api.js"></script>
<script>
(function () {
  function read(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  var role = read('role') || 'student';
  var route = read('route') || '#/home';
  if (role !== 'student' && role !== 'teacher' && role !== 'admin') { role = 'student'; }
  var D = window.CAREER_DATA;
  var res = window.API.login(D.DEMO_ACCOUNTS[role]);
  if (!res.ok) {
    document.getElementById('msg').textContent = '登录失败：' + res.msg;
    return;
  }
  var target = '../index.html' + route;
  document.getElementById('msg').innerHTML = '已用演示' + (role === 'student' ? '学生' : role === 'teacher' ? '老师' : '管理员') +
    '账号登录，正在跳转到 <code>' + route + '</code>… 如果没有自动跳转，点<a href="' + target + '">这里</a>。';
  window.setTimeout(function () { window.location.replace(target); }, 150);
})();
</script>
</body>
</html>
